services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"   # FastAPI / Web UI
      - "${VNC_PORT:-6080}:6080"   # noVNC (headed 浏览器预览)
      - "${SOLVER_HOST_PORT:-8889}:8889"   # Turnstile Solver
    environment:
      DISPLAY: ${DISPLAY:-:99}
      ACCOUNT_MANAGER_DATABASE_URL: ${ACCOUNT_MANAGER_DATABASE_URL:-sqlite:////app/data/account_manager.db}
      APP_PASSWORD: ${APP_PASSWORD:-}
      VNC_PASSWORD: ${VNC_PASSWORD:-}
      ACCOUNT_MANAGER_DISABLE_SOLVER: ${ACCOUNT_MANAGER_DISABLE_SOLVER:-false}
      SOLVER_BROWSER_TYPE: ${SOLVER_BROWSER_TYPE:-camoufox}
      OPAI_SOLVER_API_KEY: ${OPAI_SOLVER_API_KEY:-}
    volumes:
      - ./data:/app/data   # 持久化 SQLite 数据库
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health >/dev/null && curl -fsS http://127.0.0.1:8000/api/ready | grep -q '\"ok\":true'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
